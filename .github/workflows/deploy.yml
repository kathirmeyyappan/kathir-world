name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time per PR, and one for main: a newer push cancels the run before it, whatever it
# had got to, so only the newest commit's CI and deploys finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The TypeScript side, on every PR and push: format, lint, typecheck, test and build, and on main
  # the bundle Pages serves.
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node dependencies
        uses: ./.github/actions/node-deps

      - name: Format, lint, typecheck and test
        run: npm run lint && npm run typecheck && npm test

      - name: Build
        run: npm run build
        env:
          # Set the LOBBY_URL repository variable to the deployed lobby's URL; empty means offline-only.
          VITE_LOBBY_URL: ${{ vars.LOBBY_URL }}

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  # The Python side, at the same time: the bots and the infra. The bots' contract tests run against
  # a real room server, so it installs the Node dependencies as well.
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node dependencies
        uses: ./.github/actions/node-deps

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modal-bots/pyproject.toml

      - name: Install bot dependencies
        run: python -m pip install -e './modal-bots[test]' -r infra/requirements.txt

      - name: Format, lint and typecheck Python
        run: ruff format --check modal-bots infra && ruff check modal-bots infra && mypy

      - name: Test Modal bots
        run: python -m pytest modal-bots/tests infra/tests

  # Passes when both sides have, and fails when either did. Require this check on main to block
  # merges that fail CI; the deploys wait on it too.
  ci:
    # Without this a failed side would skip the job, and a skipped check counts as passed.
    if: ${{ !cancelled() }}
    needs: [node, python]
    runs-on: ubuntu-latest
    steps:
      - name: Both sides passed
        run: |
          [ "${{ needs.node.result }}" = success ] && [ "${{ needs.python.result }}" = success ]

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: CI and deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # Deploys the lobby, Room and bots apps to Modal once CI passes on main, as ./deploy.sh does by
  # hand. Needs the MODAL_TOKEN_ID and MODAL_TOKEN_SECRET repository secrets (a Modal token the CLI
  # reads from the environment).
  modal-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # deploy.sh rebuilds the bots' world map with the real sim.
      - name: Node dependencies
        uses: ./.github/actions/node-deps

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - name: Install the Modal CLI
        run: python -m pip install -r infra/requirements.txt

      - name: Deploy to Modal
        run: ./deploy.sh
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
